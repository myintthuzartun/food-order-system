```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Foodie</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================= CHECKOUT ================= */

        .checkout-page {
            min-height: 100vh;
            background: #f8f8f8;
            padding: 50px 7%;
        }

        .checkout-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #eee;
        }

        .checkout-box h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #e63946;
        }

        .payment-method {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .payment-option {
            border: 1px solid #ddd;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .payment-option:hover {
            border-color: #e63946;
        }

        .payment-option input {
            margin-right: 8px;
        }

        .order-summary {
            position: sticky;
            top: 95px;
            height: fit-content;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .confirm-btn {
            width: 100%;
            border: none;
            background: #e63946;
            color: white;
            padding: 15px;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .confirm-btn:hover {
            background: #c92f3c;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #e63946;
            font-weight: bold;
        }

        .empty-checkout {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }

        @media (max-width: 800px) {

            .checkout-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            🍴 <span>Foodie</span>
        </div>

        <a href="index.html"
           class="back-btn">
            ← Back to Menu
        </a>

    </header>


    <!-- ================= CHECKOUT ================= -->

    <section class="checkout-page">

        <div class="checkout-container">


            <!-- ================= CUSTOMER FORM ================= -->

            <div class="checkout-box">

                <h2>
                    📝 Customer Information
                </h2>


                <form id="checkout-form">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="customer-name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="customer-phone"
                            placeholder="09xxxxxxxxx"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="customer-email"
                            placeholder="example@gmail.com"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Delivery Address
                        </label>

                        <textarea
                            id="delivery-address"
                            placeholder="Enter your delivery address"
                            required></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Payment Method
                        </label>

                        <div class="payment-method">

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Cash on Delivery"
                                    checked>

                                💵 Cash on Delivery

                            </label>


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Mobile Banking">

                                📱 Mobile Banking

                            </label>


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Credit Card">

                                💳 Credit Card

                            </label>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Order Note
                        </label>

                        <textarea
                            id="order-note"
                            placeholder="Example: Less spicy, no onion..."></textarea>

                    </div>


                    <button
                        type="submit"
                        class="confirm-btn">

                        Confirm Order

                    </button>

                </form>

            </div>


            <!-- ================= ORDER SUMMARY ================= -->

            <div class="checkout-box order-summary">

                <h2>
                    🛒 Order Summary
                </h2>


                <div id="checkout-items">

                    <!-- Items will be loaded by JavaScript -->

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="checkout-total">
                        $0.00
                    </span>

                </div>

            </div>


        </div>

    </section>


    <script>

        // ========================================
        // LOAD CART
        // ========================================

        let cart =
            JSON.parse(
                localStorage.getItem("foodieCart")
            ) || [];


        // ========================================
        // DISPLAY ORDER
        // ========================================

        function displayCheckout() {

            const container =
                document.getElementById(
                    "checkout-items"
                );

            const totalElement =
                document.getElementById(
                    "checkout-total"
                );


            container.innerHTML = "";


            if (cart.length === 0) {

                container.innerHTML = `
                    <div class="empty-checkout">
                        Your cart is empty.
                        <br><br>
                        <a href="index.html">
                            Go back to menu
                        </a>
                    </div>
                `;

                totalElement.textContent = "$0.00";

                return;
            }


            let total = 0;


            cart.forEach(item => {

                const itemTotal =
                    item.price * item.quantity;

                total += itemTotal;


                container.innerHTML += `

                    <div class="summary-item">

                        <span>
                            ${item.image}
                            ${item.name}
                            × ${item.quantity}
                        </span>

                        <strong>
                            $${itemTotal.toFixed(2)}
                        </strong>

                    </div>

                `;

            });


            totalElement.textContent =
                "$" + total.toFixed(2);

        }


        // ========================================
        // SUBMIT ORDER
        // ========================================

        document
            .getElementById("checkout-form")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                if (cart.length === 0) {

                    alert(
                        "Your cart is empty!"
                    );

                    return;
                }


                const name =
                    document.getElementById(
                        "customer-name"
                    ).value;


                const phone =
                    document.getElementById(
                        "customer-phone"
                    ).value;


                const address =
                    document.getElementById(
                        "delivery-address"
                    ).value;


                const payment =
                    document.querySelector(
                        'input[name="payment"]:checked'
                    ).value;


                let total = 0;


                cart.forEach(item => {

                    total +=
                        item.price * item.quantity;

                });


                alert(
                    "Order Confirmed! 🎉\n\n" +
                    "Customer: " + name + "\n" +
                    "Phone: " + phone + "\n" +
                    "Payment: " + payment + "\n" +
                    "Total: $" +
                    total.toFixed(2)
                );


                // Clear cart
                localStorage.removeItem(
                    "foodieCart"
                );

                cart = [];


                // Go back to home
                window.location.href =
                    "index.html";

            });


        // ========================================
        // INITIALIZE
        // ========================================

        displayCheckout();

    </script>

</body>

</html>
```
